name: Check practice data

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No page scans in assets or JSON
        run: python3 scripts/check_practice_data.py
      - name: OCR garble and RC instruction sense
        run: python3 scripts/ocr_garble_sense.py
